[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-agent"
version = "0.1.0"
description = "Autonomous Multimodal Scientific Discovery Agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Orchestration + LLM (provider chosen at runtime via LLM_MODEL in .env)
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.2",
    # Vector DB + embeddings
    "pymilvus>=2.5",
    "sentence-transformers>=3.0",
    # Literature ingestion
    "arxiv>=2.1",
    "biopython>=1.84",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "tenacity>=8.2",
    # Sandbox
    "docker>=7.1",
    # Stats / data
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    # Config / dashboard
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
discovery-agent = "discovery_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Docker / Milvus / network (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
